services:
  vaporfetch:
    image: ghcr.io/theretrogeekyt-dev/vaporfetch:latest
    container_name: vaporfetch
    platform: linux/amd64
    restart: unless-stopped
    security_opt:
      - seccomp=unconfined
    ports:
      - "8080:8080"
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=000
      - DEFAULT_PLATFORM=windows
      - VALIDATE_DOWNLOADS=true
      - STEAM_FORCE_IPV4=1
      - PORT=8080
    volumes:
      - ./data:/data
      - ./downloads:/downloads
