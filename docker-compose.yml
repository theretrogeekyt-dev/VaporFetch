services:
  vaporfetch:
    # Option 1 (Recommended): Pull pre-built image from GitHub Container Registry
    # (Fastest, zero build time, no manual code downloads required)
    image: ghcr.io/theretrogeekyt-dev/vaporfetch:latest

    # Option 2 (Alternative): Automatically download and build directly from GitHub:
    # build:
    #   context: https://github.com/theretrogeekyt-dev/VaporFetch.git#main

    container_name: vaporfetch
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DEFAULT_PLATFORM=windows
      - VALIDATE_DOWNLOADS=true
      - PORT=8080
    volumes:
      - ./data:/data
      - ./downloads:/downloads
      - ./data/steam_root:/root/.steam
      - ./data/steam_share:/root/.local/share/Steam
