version: '3.8'

services:
  vaporfetch:
    image: ghcr.io/theretrogeekyt-dev/vaporfetch:latest
    container_name: vaporfetch
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # ====================================================================
      # User and Group permissions for writing to NAS shares (SMB / CIFS / NFS)
      # Synology DSM default: PUID=1026, PGID=100
      # Unraid default:       PUID=99,   PGID=100
      # Standard Linux:       PUID=1000, PGID=1000 (run `id $USER` on host/NAS)
      # ====================================================================
      - PUID=1000
      - PGID=1000
      - UMASK=002

      # Internal Web UI Port
      - PORT=8080

      # Optional: Default Steam credentials (can also be entered dynamically in Web UI)
      - STEAM_USERNAME=
      - STEAM_PASSWORD=

    volumes:
      # ====================================================================
      # 1. NAS Storage Mount for Game Downloads
      # Map your NAS share path (e.g. /volume1/games on Synology, /mnt/user/games on Unraid)
      # ====================================================================
      - /mnt/nas/games:/downloads

      # ====================================================================
      # 2. Persistent Configuration & Steam Guard Session Cache
      # Holds Steam login tokens, Steam Guard authorization keys, and task history
      # ====================================================================
      - /path/to/appdata/vaporfetch/config:/config

# ========================================================================
# OPTIONAL: Direct Docker CIFS/SMB Share Mount (Alternative to Host Mount)
# ========================================================================
# volumes:
#   nas_games:
#     driver: local
#     driver_opts:
#       type: cifs
#       o: "username=nasuser,password=naspass,uid=1000,gid=1000,iocharset=utf8"
#       device: "//192.168.1.100/games"
